name: odomex
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.0
  flutter_riverpod: ^2.6.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  fl_chart: ^1.2.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.2
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/images/odomex_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/odomex_logo_adaptive_foreground.png"

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#0F172A"
  image: "assets/images/odomex_logo.png"
  image_dark: "assets/images/odomex_logo.png"
  android_12:
    image: "assets/images/odomex_logo_splash12.png"
    icon_background_color: "#F8FAFC"
    image_dark: "assets/images/odomex_logo_splash12.png"
    icon_background_color_dark: "#0F172A"
    color: "#F8FAFC"
    color_dark: "#0F172A"
  android: true
  ios: true
  web: false

